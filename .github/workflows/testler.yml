name: testler

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Kod kalitesi (ruff)
        run: ruff check .
      - name: Testler + kod kapsamı
        run: pytest -q --cov --cov-report=term-missing --cov-fail-under=90
